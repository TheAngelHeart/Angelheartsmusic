<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel Hearts Music & Poetry</title>
    <!-- Tailwind CSS CDN for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for social media icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" xintegrity="sha512-iecdLmaskl7CVkj2w3e2+J3vD8hM0z6iP6n7Kqg/y2E4r6W5iN2C/f5f0V4E4K4wF2P2n9wG3l5n4F5m5q5f5q5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* Use the Inter font from Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        /* Hide the scrollbar for the poem display but keep it functional */
        .custom-scrollbar-hidden::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header Section -->
    <header class="bg-white shadow-lg rounded-b-3xl p-6 md:p-8">
        <div class="container mx-auto flex flex-col md:flex-row items-center justify-between">
            <h1 class="text-4xl md:text-5xl font-extrabold text-blue-600 mb-4 md:mb-0">
                Angel Hearts Music
            </h1>
            <!-- Social Media & Buy CD Links -->
            <div class="flex items-center space-x-4">
                <!-- TikTok Link (New) -->
                <a href="https://www.tiktok.com/@yourprofile" target="_blank" rel="noopener noreferrer" class="text-gray-600 hover:text-blue-500 transition-colors">
                    <i class="fab fa-tiktok text-3xl"></i>
                </a>
                <!-- YouTube Link -->
                <a href="https://www.youtube.com/@yourprofile" target="_blank" rel="noopener noreferrer" class="text-gray-600 hover:text-blue-500 transition-colors">
                    <i class="fab fa-youtube text-3xl"></i>
                </a>
                <!-- Facebook Link -->
                <a href="https://www.facebook.com/yourprofile" target="_blank" rel="noopener noreferrer" class="text-gray-600 hover:text-blue-500 transition-colors">
                    <i class="fab fa-facebook-f text-3xl"></i>
                </a>
                <!-- Instagram Link -->
                <a href="https://www.instagram.com/yourprofile" target="_blank" rel="noopener noreferrer" class="text-gray-600 hover:text-blue-500 transition-colors">
                    <i class="fab fa-instagram text-3xl"></i>
                </a>
                <!-- "Buy My CD" Button (New) -->
                <a href="#" target="_blank" rel="noopener noreferrer" class="bg-purple-600 text-white font-bold py-3 px-6 rounded-full shadow-lg hover:bg-purple-700 transition-transform transform hover:scale-105">
                    Buy My CD
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content - Poem Generator Section -->
    <main class="container mx-auto my-8 p-6 md:p-8">
        <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-xl p-8 space-y-6">

            <!-- Poem Input Form -->
            <div class="text-center">
                <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">Create Your Poem</h2>
                <p class="text-gray-600">Enter a few keywords or a theme, and I'll write a new poem for you.</p>
            </div>

            <form id="poemForm" class="space-y-4">
                <textarea id="poemPrompt" rows="4" class="w-full p-4 rounded-lg border-2 border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors" placeholder="e.g., 'Angel hearts, hope, love, peace'"></textarea>
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-blue-700 transition-colors">Generate Poem</button>
            </form>

            <!-- Poem Output Display -->
            <div class="bg-gray-50 p-6 rounded-lg border-2 border-dashed border-gray-300 text-gray-700 custom-scrollbar-hidden overflow-y-auto max-h-[500px] leading-relaxed">
                <p id="poemOutput" class="text-center italic">Your generated poem will appear here...</p>
            </div>

        </div>
    </main>

    <!-- Footer Section -->
    <footer class="bg-white shadow-inner rounded-t-3xl p-4 md:p-6 text-center text-sm text-gray-500">
        <p>&copy; 2024 Angel Hearts Music. All rights reserved.</p>
    </footer>

    <!-- JavaScript for Poem Generation -->
    <script>
        const form = document.getElementById('poemForm');
        const poemPromptInput = document.getElementById('poemPrompt');
        const poemOutput = document.getElementById('poemOutput');
        const apiKey = ""; // API key will be provided at runtime by the Canvas environment

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = poemPromptInput.value.trim();
            if (!prompt) {
                poemOutput.textContent = 'Please enter a prompt to generate a poem.';
                return;
            }

            poemOutput.textContent = 'Generating your poem...';

            try {
                // The API call to generate the poem
                let chatHistory = [];
                chatHistory.push({ role: "user", parts: [{ text: `Generate a short, uplifting poem about the following themes: ${prompt}` }] });
                const payload = { contents: chatHistory };
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error("API Error details:", errorData);
                    poemOutput.textContent = `API Error: ${response.status}. Please check the browser console for details.`;
                    return;
                }

                const result = await response.json();
                const generatedText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (generatedText) {
                    poemOutput.textContent = generatedText;
                } else {
                    poemOutput.textContent = 'Sorry, the API response was empty. Please try again.';
                }
            } catch (error) {
                console.error('Error generating poem:', error);
                poemOutput.textContent = `Sorry, the request failed. There was a network or other technical issue. Please try again later.`;
            }
        });
    </script>
</body>
</html>
